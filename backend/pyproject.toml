[project]
name = "wml"
version = "0.1.0"
description = ""
authors = [
  { name = "Limbend", email = "termir988@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.31.1",
  "sqlalchemy>=2.0.35",
  "python-dateutil>=2.9.0.post0",
  "gunicorn>=23.0.0",
  "pydantic-settings>=2.5.2",
  "aiobotocore>=2.15.2",
  "python-multipart>=0.0.17",
  "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "black>=24.10.0",
  "httpx>=0.27.2",
  "pytest-dependency>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = [ ".", "api" ]
asyncio_mode="auto"